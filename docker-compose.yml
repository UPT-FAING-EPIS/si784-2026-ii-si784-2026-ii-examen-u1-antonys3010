services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flightsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - flightdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flightsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=flightsdb;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy
volumes:
  flightdata:
